<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="PCA illustration: 2D data projected onto its two principal components">
  <rect width="480" height="300" fill="#0b0b0e" rx="8"/>
  <g stroke="rgba(255,255,255,0.07)">
    <line x1="80" y1="40" x2="80" y2="260" stroke-dasharray="3 4"/>
    <line x1="160" y1="40" x2="160" y2="260" stroke-dasharray="3 4"/>
    <line x1="240" y1="40" x2="240" y2="260" stroke-dasharray="3 4"/>
    <line x1="320" y1="40" x2="320" y2="260" stroke-dasharray="3 4"/>
    <line x1="400" y1="40" x2="400" y2="260" stroke-dasharray="3 4"/>
    <line x1="80" y1="120" x2="440" y2="120" stroke-dasharray="3 4"/>
    <line x1="80" y1="200" x2="440" y2="200" stroke-dasharray="3 4"/>
  </g>
  <!-- data points (correlated, cigar-shaped cloud) -->
  <g fill="#8ea7e8" opacity="0.75">
    <circle cx="150" cy="210" r="3"/>
    <circle cx="185" cy="190" r="3"/>
    <circle cx="218" cy="172" r="3"/>
    <circle cx="255" cy="152" r="3"/>
    <circle cx="290" cy="132" r="3"/>
    <circle cx="128" cy="222" r="3"/>
    <circle cx="322" cy="112" r="3"/>
    <circle cx="360" cy="92" r="3"/>
    <circle cx="132" cy="196" r="3"/>
    <circle cx="205" cy="186" r="3"/>
    <circle cx="268" cy="138" r="3"/>
    <circle cx="305" cy="128" r="3"/>
    <circle cx="345" cy="116" r="3"/>
    <circle cx="172" cy="202" r="3"/>
    <circle cx="238" cy="160" r="3"/>
  </g>
  <!-- principal axes -->
  <line x1="120" y1="240" x2="398" y2="78" stroke="#6e9bff" stroke-width="2"/>
  <line x1="255" y1="150" x2="214" y2="192" stroke="#9d86ff" stroke-width="2"/>
  <!-- origin -->
  <circle cx="255" cy="150" r="4" fill="#3ddc97"/>
  <text x="392" y="70" fill="#6e9bff" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">v₁ (max variance)</text>
  <text x="166" y="208" fill="#9d86ff" font-size="12" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">v₂</text>
  <text x="86" y="286" fill="rgba(255,255,255,0.45)" font-size="11" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">eigenvectors = new basis · λ = variance along each</text>
</svg>